# ============================================================
# CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU CHUẨN (JDBC CONFIG)
# Hỗ trợ: Microsoft SQL Server (SSMS), MySQL & SQLite Fallback
# ============================================================

# Loại CSDL: sqlserver (mặc định) HOẶC mysql
db.type=sqlserver

# ------------------------------------------------------------
# 1. CẤU HÌNH CHO MICROSOFT SQL SERVER (SSMS)
# ------------------------------------------------------------
db.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Nếu chạy 1 máy: localhost. Nếu dùng chung mạng LAN 2 máy: điền IP máy chủ (ví dụ: 192.168.1.15)
db.host=192.174.10.43
db.port=1433
db.name=ql_canhbao_hocvu
# Tài khoản đăng nhập SQL Server Authentication (mặc định là 'sa' hoặc tài khoản bạn đã tạo)
db.user=sa
db.password=240605
db.params=encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8;

